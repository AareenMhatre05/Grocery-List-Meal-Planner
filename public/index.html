    <meta name="apple-mobile-web-app-title" content="Meal Planner" />
    <!--
      Brand icons. ?v=2 makes browsers fetch the new icons instead of a cached old favicon.
      favicon.ico: fallback for older browsers. favicon.svg: Chrome, Edge, Firefox.
      apple-touch-icon.png: iOS home screen and Safari bookmarks.
      manifest.json: install (PWA) icons, including a maskable icon for Android.
      %PUBLIC_URL% is replaced with the public folder URL at build time.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=2" />
    <title>Grocery & Meal Planner</title>
  </head>
